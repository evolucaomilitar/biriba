<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro tático -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c271e" />
      <stop offset="60%" stop-color="#0f1611" />
      <stop offset="100%" stop-color="#070a08" />
    </radialGradient>

    <!-- Gradiente Metálico Ouro / Titânio -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="25%" stop-color="#b8860b" />
      <stop offset="50%" stop-color="#fff8dc" />
      <stop offset="75%" stop-color="#8b6508" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Gradiente Titânio Escuro -->
    <linearGradient id="titaniumRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a554d" />
      <stop offset="50%" stop-color="#1f2621" />
      <stop offset="100%" stop-color="#3b443e" />
    </linearGradient>

    <!-- Gradiente Azul Royal Oficial CPM -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#132c8c" />
      <stop offset="100%" stop-color="#0a1744" />
    </linearGradient>

    <!-- Textura de Trama Militar (Fibra de Carbono) -->
    <pattern id="carbonPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#0d130f" />
      <polygon points="0,0 6,0 3,6" fill="#141c16" />
      <polygon points="6,0 12,0 9,6" fill="#18221b" />
      <polygon points="0,6 6,6 3,12" fill="#18221b" />
      <polygon points="6,6 12,6 9,12" fill="#141c16" />
    </pattern>

    <!-- Filtro de Sombra 3D -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (Squircle / App Icon Padrão) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="#2a3a2d" stroke-width="4" />
  
  <!-- Círculo interno texturizado com trama tática -->
  <circle cx="256" cy="256" r="232" fill="url(#carbonPattern)" stroke="url(#titaniumRing)" stroke-width="12" />

  <!-- Anel Externo Dourado em Ponto de Bordado -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#metalRim)" stroke-width="5" stroke-dasharray="8 4" opacity="0.85" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f0c20a" stroke-width="1.5" opacity="0.5" />

  <!-- Brasão / Escudo Central de Bordado -->
  <g filter="url(#shadow3d)">
    <!-- Escudo Traseiro Azul Royal -->
    <path d="M 256 70 C 340 70 380 90 380 170 C 380 290 256 360 256 375 C 256 360 132 290 132 170 C 132 90 172 70 256 70 Z" 
          fill="url(#blueGrad)" 
          stroke="#f0c20a" 
          stroke-width="6" 
          stroke-linejoin="round" />

    <!-- Pesponto Interno do Escudo -->
    <path d="M 256 82 C 330 82 366 100 366 172 C 366 280 256 345 256 358 C 256 345 146 280 146 172 C 146 100 182 82 256 82 Z" 
          fill="none" 
          stroke="rgba(255, 255, 255, 0.45)" 
          stroke-width="2" 
          stroke-dasharray="5 3" />
  </g>

  <!-- Estrela Facetada 3D Militar no Centro do Escudo -->
  <g transform="translate(256, 195) scale(1.15)" filter="url(#shadow3d)">
    <!-- Facetas da Estrela em Azul Royal e Dourado -->
    <polygon points="0,-65 19,-20 65,-20 28,8 42,54 0,26 -42,54 -28,8 -65,-20 -19,-20" fill="#f0c20a" stroke="#fff8dc" stroke-width="1.5" />
    <polygon points="0,-65 19,-20 0,0" fill="#fff" opacity="0.6" />
    <polygon points="65,-20 28,8 0,0" fill="#d4af37" />
    <polygon points="42,54 0,26 0,0" fill="#8b6508" />
    <polygon points="-42,54 0,26 0,0" fill="#b8860b" />
    <polygon points="-65,-20 -28,8 0,0" fill="#fff" opacity="0.4" />
    <polygon points="-19,-20 0,-65 0,0" fill="#ffd700" />
    
    <!-- Centro do Brevê -->
    <circle cx="0" cy="0" r="14" fill="#132c8c" stroke="#f0c20a" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#fff" />
  </g>

  <!-- Tarjeta / Biriba de Bordado no Rodapé do Escudo -->
  <g transform="translate(256, 395)" filter="url(#shadow3d)">
    <!-- Fundo da Biriba Branca Oficial -->
    <rect x="-170" y="-28" width="340" height="56" rx="6" fill="#ffffff" stroke="#132c8c" stroke-width="6" />
    <rect x="-165" y="-23" width="330" height="46" rx="3" fill="none" stroke="rgba(19, 44, 140, 0.3)" stroke-width="1.5" stroke-dasharray="4 2.5" />
    
    <!-- Texto Bordado CPM -->
    <text x="0" y="8" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#132c8c" text-anchor="middle" letter-spacing="3" style="text-shadow: 1px 1px 0px rgba(0,0,0,0.3);">
      BORDADOS CPM
    </text>
  </g>

  <!-- Texto Superior em Arco / Faixa: EVOLUÇÃO MILITAR -->
  <g>
    <text x="256" y="52" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="19" fill="#f0c20a" text-anchor="middle" letter-spacing="4" filter="url(#glowGold)">
      EVOLUÇÃO MILITAR
    </text>
  </g>

  <!-- Inscrição Inferior: APP OFICIAL -->
  <g>
    <text x="256" y="475" font-family="'Montserrat', sans-serif" font-weight="800" font-size="13" fill="#86efac" text-anchor="middle" letter-spacing="3">
      ★ APLICATIVO OFICIAL ★
    </text>
  </g>
</svg>